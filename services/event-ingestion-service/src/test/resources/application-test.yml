spring:
  application:
    name: event-ingestion-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: tracking

# JWT Configuration for tests
jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 86400000
  issuer: supplysight-test

# Ingestion settings
ingestion:
  max-payload-size: 65536
  late-arrival-tolerance-hours: 72
  batch-size: 100

# Logging
logging:
  level:
    root: WARN
    com.supplysight: INFO
    org.apache.kafka: WARN

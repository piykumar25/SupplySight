spring:
  application:
    name: identity-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: identity

# JWT Configuration for tests
jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 86400000
  issuer: supplysight-test

# Logging
logging:
  level:
    root: WARN
    com.supplysight: INFO
    org.springframework.security: WARN

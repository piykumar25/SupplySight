spring:
  application:
    name: prediction-engine-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:supplysight}
    username: ${POSTGRES_USER:supplysight}
    password: ${POSTGRES_PASSWORD:supplysight_secret_new}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: prediction
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: prediction

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: prediction-engine-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.supplysight.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.supplysight.common.event.TrackingEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

jwt:
  # Hardcoded secret to ensure consistency across services
  secret: supplysight-secret-key-that-should-be-at-least-256-bits-long-for-hs256

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Prediction heuristics configuration
prediction:
  # Average speed assumption (km/h)
  default-average-speed: 50.0
  # Maximum reasonable speed (km/h)
  max-reasonable-speed: 120.0
  # Minimum speed threshold for anomaly (km/h)
  min-speed-threshold: 5.0
  # Dwell time threshold for delay warning (hours)
  dwell-time-warning-hours: 4
  # Dwell time threshold for high delay risk (hours)
  dwell-time-critical-hours: 8
  # Delay probability thresholds
  delay-probability-warning: 0.3
  delay-probability-high: 0.6

logging:
  level:
    root: INFO
    com.supplysight: DEBUG
    org.apache.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] [%X{tenantId}] %-5level %logger{36} - %msg%n"

server:
  port: 0

spring:
  application:
    name: api-gateway-test
  main:
    web-application-type: reactive
  
  data:
    redis:
      host: localhost
      port: 6379
  
  cloud:
    gateway:
      routes:
        - id: test-route
          uri: http://localhost:8081
          predicates:
            - Path=/test/**

jwt:
  secret: testSecretKeyForGatewayTestThatIsLongEnough123456
  issuer: supplysight-test

kafka:
  bootstrap-servers: localhost:9092

gateway:
  auth:
    public-paths:
      - /api/v1/login
      - /api/v1/register
      - /actuator/**
  
  audit:
    enabled: false
    topic: tracking.audit

logging:
  level:
    com.supplysight: DEBUG
    org.springframework.cloud.gateway: DEBUG

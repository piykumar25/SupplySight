server:
  port: 0

spring:
  application:
    name: audit-service-test
  
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: audit
  
  flyway:
    enabled: true
    schemas: audit
    locations: classpath:db/migration
  
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    consumer:
      group-id: audit-test-group
      auto-offset-reset: earliest

jwt:
  secret: testSecretKeyForAuditServiceTestThatIsLongEnough123456
  issuer: supplysight-test

audit:
  topics:
    audit: tracking.audit
    alerts: tracking.alerts

logging:
  level:
    com.supplysight: DEBUG
    org.springframework: INFO

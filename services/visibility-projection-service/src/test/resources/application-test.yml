spring:
  application:
    name: visibility-projection-service-test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: visibility

  cache:
    type: simple

jwt:
  secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm

logging:
  level:
    root: WARN
    com.supplysight: INFO
    org.apache.kafka: WARN

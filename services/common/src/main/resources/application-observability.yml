# Shared observability configuration - include in each service's application.yml
# Add to spring profile section or merge with existing config

# Tracing configuration (Micrometer Tracing + OpenTelemetry)
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # 100% sampling for dev, reduce in production
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
